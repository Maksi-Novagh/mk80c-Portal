# Blueprint specification pour Render (render.yaml)
# Documentation : https://render.com/docs/blueprint-spec

services:
  - type: web
    name: mk80c-portal
    runtime: node
    plan: free
    region: frankfurt              # Région européenne (Frankfurt)
    buildCommand: "echo 'No build required'"
    startCommand: "node -e 'require(\"http\").createServer((req, res) => res.end(\"MK80C Portal Dummy Server is running!\")).listen(process.env.PORT || 10000);'"    
    autoDeployTrigger: checksPass         # Redéploiement automatique lors d'un git push
    
    # Variables d'environnement
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"              # Port interne par défaut sur Render
      - key: SESSION_SECRET
        generateValue: true         # Clé secrète générée automatiquement par Render
